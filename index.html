<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Smart Booking Platform for Travel & Tourism Agencies</title>
</head>
<body>
    <div class="container">
        <input type="text" id="inp1" placeholder="Enter your name">
        <input type="number" id="inp2" placeholder="Enter your phone number">
        <select id="select1">
        <option value="" hidden disabled selected>Please select a tourist destination</option>
        <option value="190">Erbil</option>
        <option value="350">Iran</option>
        <option value="400">Turkey</option>
        <option value="250">UAE</option>
        <option value="550">Saudi Arabia</option>
        </select>
        <label for="inp3">Please enter the travel date</label>
        <input type="date" id="inp3">
        <select id="select2">
        <option value="">Select mode of travel</option>
        <option value="100">Flight (Air travel)</option>
        <option value="70">Land travel (VIP bus / Private car)</option>
        </select>
        <input type="number" placeholder="Enter number of people" id="inp4">
        <button id="btn">Send booking via WhatsApp</button>
        <h3 id="h3"></h3>
        <span id="span1"></span>
        <span id="span2"></span>
        </div>
    <script src="index.js"></script>
</body>
</html>
